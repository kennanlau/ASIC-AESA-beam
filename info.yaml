# Tiny Tapeout project information

project:
  title: "AESA Beam Steering Engine"
  author: "Kennan Lau"
  description: "Steering angle in, 16 per-element 7-bit phase words out (2.8125 deg steps) for a 4x4 half-wavelength array."
  language: "Verilog"
  clock_hz: 50000000
  tiles: "1x1"
  top_module: "tt_um_kennanlau_beam_steer"
  source_files:
    - "sin_lut.v"
    - "beam_steer.v"
    - "tt_um_kennanlau_beam_steer.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "wr"
  ui[1]: "sel[0]"
  ui[2]: "sel[1]"
  ui[3]: "sel[2]"
  ui[4]: "element[0]"
  ui[5]: "element[1]"
  ui[6]: "element[2]"
  ui[7]: "element[3]"

  # Outputs
  uo[0]: "phase[0]"
  uo[1]: "phase[1]"
  uo[2]: "phase[2]"
  uo[3]: "phase[3]"
  uo[4]: "phase[4]"
  uo[5]: "phase[5]"
  uo[6]: "phase[6]"
  uo[7]: "write_ack"

  # Bidirectional pins
  uio[0]: "data[0]"
  uio[1]: "data[1]"
  uio[2]: "data[2]"
  uio[3]: "data[3]"
  uio[4]: "data[4]"
  uio[5]: "data[5]"
  uio[6]: "data[6]"
  uio[7]: "data[7]"

# Do not change!
yaml_version: 6
